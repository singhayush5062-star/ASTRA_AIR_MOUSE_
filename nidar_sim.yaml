common:
    lid_topic:  "/velodyne_points"
    imu_topic:  "/mavros/imu/data"
    time_sync_en: false
    time_offset_lidar_to_imu: 0.0

preprocess:
    lidar_type: 2                # Velodyne type
    scan_line: 16
    scan_rate: 10                # 10Hz
    timestamp_unit: 2
    blind: 0.9                   # blind radius

mapping:
    acc_cov: 0.1
    gyr_cov: 0.1
    b_acc_cov: 0.0001
    b_gyr_cov: 0.0001
    fov_degree:    360
    det_range:     130.0
    extrinsic_est_en:  false     # Don't auto-estimate extrinsics, we supply them
    extrinsic_T: [ 0.0,  0.0,  0.08 ] # Translated by 0.08m in Z (LiDAR above IMU)
    extrinsic_R: [ 1, 0, 0,
                   0, 1, 0,
                   0, 0, 1 ]

publish:
    path_en:  true
    scan_publish_en:  true
    dense_publish_en: true
    scan_bodyframe_pub_en: true
