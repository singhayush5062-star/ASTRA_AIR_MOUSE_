# FUEL Indoor Exploration Planner Parameters
sdf_map:
  resolution: 0.1
  map_size_x: 20.0
  map_size_y: 20.0
  map_size_z: 3.5
  local_update_range_x: 5.5
  local_update_range_y: 5.5
  local_update_range_z: 3.0
  obstacles_inflation: 0.20
  local_bound_inflate: 0.5
  local_map_margin: 10
  ground_height: 0.0

  # LiDAR Sensor Properties
  use_depth_filter: false
  depth_filter_tolerance: 0.15
  depth_filter_maxdist: 10.0
  depth_filter_mindist: 0.2
  depth_filter_margin: 2
  k_depth_scaling_factor: 1000.0
  skip_pixel: 2

  # Raycasting
  p_hit: 0.65
  p_miss: 0.35
  p_min: 0.12
  p_max: 0.97
  p_occ: 0.80

exploration_planner:
  # Arena bounding box (-10m to 10m on X/Y, 0.2m to 2.5m height)
  box_min_x: -10.0
  box_min_y: -10.0
  box_min_z: 0.2
  box_max_x: 10.0
  box_max_y: 10.0
  box_max_z: 2.5

  # Kinodynamic & Clearance Tuning for 1m Corridors
  max_vel: 1.5
  max_acc: 0.3
  max_yaw_rate: 1.5
  d_min: 0.25

  # Frontier & Perception Settings
  frontier_size_min: 5
  frontier_cluster_min: 10
