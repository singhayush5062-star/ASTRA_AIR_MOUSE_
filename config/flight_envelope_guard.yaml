# Production-Grade Flight Envelope Guard Configuration
# NIDAR 2026 AirMouse Flight Volume Containment

flight_envelope_guard:
  frame_id: "world"
  
  # Authoritative Gazebo World Frame Boundaries
  world_x_min: -7.0
  world_x_max: 7.0
  world_y_min: -7.0
  world_y_max: 7.0
  world_z_min: 0.3
  world_z_max: 2.2

  # camera_init frame bounds are derived at runtime from world bounds
  # via world_to_camera() — no separate config needed

  # Safety Margin & Rate
  boundary_margin: 0.2
  publish_rate: 20.0
  default_altitude: 1.5
